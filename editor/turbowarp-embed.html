<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TurboWarp Embed</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b0f17; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <!--
    Starter embed: the hosted TurboWarp editor is loaded inside this iframe.
    This page acts as a communication bridge between the parent editor (app.js)
    and TurboWarp via postMessage.

    Future integration steps:
    1. Replace the src below with a self-hosted TurboWarp build for tighter API access.
    2. Handle incoming messages from the parent (open .sb3, request export).
    3. Forward TurboWarp events back to the parent.
  -->
  <iframe
    id="tw"
    src="https://turbowarp.org/editor"
    referrerpolicy="no-referrer"
    sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups"
    title="TurboWarp editor"
  ></iframe>

  <script>
    // ── Receive messages from the parent editor ──────────────────────────
    window.addEventListener('message', function(event) {
      // Basic allowlist check; tighten origin if self-hosting.
      var tw = document.getElementById('tw');
      if (!tw) return;

      switch (event.data && event.data.type) {
        case 'tw-open-sb3':
          // TODO: forward ArrayBuffer to TurboWarp when self-hosted.
          // tw.contentWindow.postMessage({ type: 'load-sb3', data: event.data.buffer }, '*');
          break;
        case 'tw-export-sb3':
          // TODO: request export from TurboWarp and post back to parent.
          // tw.contentWindow.postMessage({ type: 'export-sb3' }, '*');
          break;
      }
    });

    // ── Forward select events from TurboWarp to parent ───────────────────
    window.addEventListener('message', function(event) {
      if (event.source === window) return; // ignore self
      // Only relay known TurboWarp message types to parent.
      if (event.data && typeof event.data.type === 'string' && event.data.type.startsWith('tw-')) {
        window.parent.postMessage(event.data, '*');
      }
    });
  </script>
</body>
</html>
